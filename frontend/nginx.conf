server {
    listen 80;
    root /usr/share/nginx/html;

    # Адрес api ищем через DNS Docker при запросах, а не один раз при старте:
    # после пересоздания контейнера api у него новый IP, и nginx со старым адресом отдавал 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # API и SSE-чат — на Go api. Фронт и бэк на одном origin, CORS не нужен.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: не буферизуем, иначе ответ придёт целиком в конце
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
