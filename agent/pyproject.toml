[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy"
version = "0.1.0"
description = "Agent is named Ai-buddy for hack & change 2026 Avito"
requires-python = ">=3.14.4"
authors = [
    { name = "team mogwarts", email = "mogwarts@team.ru" }
]
dependencies = [
    "Flask>=3.1.3,<4",
    "gunicorn>=23,<26",
    "pydantic>=2.14.3,<3",
    "langgraph>=1.1,<2",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "httpx>=0.27,<1",
    "mcp>=1.26,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "api*", "chat*", "clients*", "memory*", "demo*"]

[tool.setuptools.package-data]
api = ["demo.html"]
